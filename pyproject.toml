[project]
name = "dflb"
version = "0.1.0"
description = "DorkFi Liquidation Bot"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "py-algorand-sdk>=2.0.0",
    "python-dotenv>=1.0.0",
    "msgpack>=1.0.0",
    "PyNaCl>=1.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"

[tool.black]
line-length = 100
target-version = ["py39"]
include = '\.pyi?$'
exclude = '''
/(\.git|__pycache__|\.venv|node_modules)/
'''
